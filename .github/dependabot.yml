version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Patch and minor bumps arrive as one PR to keep the noise down; majors
    # come separately, since those are the ones worth reading.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
